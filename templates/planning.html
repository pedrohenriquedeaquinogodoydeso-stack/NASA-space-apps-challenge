<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="Plan your mission to Mars: landing site, rocket, modules and crew.">
    <title>Mission Planning | Mars Mission</title>
</head>
<body style="margin: 0; background: #070b16;">
    <div id="root"></div>

    <!-- Dados injetados pelo Flask via Jinja2 -->
    <script id="mission-bootstrap" type="application/json">
        {{ {
            "nasaConstants": nasa_constants,
            "marsSites": mars_sites,
            "modules": modules,
            "rocketArchitectures": rocket_architectures,
            "defaultModules": default_modules,
            "initialLoadout": initial_loadout
        } | tojson }}
    </script>

    <!-- React e ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Código compartilhado (estilos, header e footer) + sidebar de telemetria + página de planejamento -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mission-sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/planning.js') }}"></script>
</body>
</html>
