<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="Plan your mission to Mars: landing site, rocket, modules and crew.">
    <title>Mission Planning | Mars Mission</title>
    <style>
        @keyframes launch-screen-shake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            12%, 36%, 60%, 84% { transform: translate3d(-7px, 0, 0); }
            24%, 48%, 72%, 96% { transform: translate3d(7px, 0, 0); }
        }

        @keyframes launch-screen-final {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            12%, 36% { transform: translate3d(-8px, 0, 0) scale(1); }
            24%, 48% { transform: translate3d(8px, 0, 0) scale(1); }
            60% { transform: translate3d(0, 0, 0) scale(1.02); opacity: 1; }
            100% { transform: translate3d(0, -18px, 0) scale(1.14); opacity: 0.08; }
        }

        @keyframes launch-flash {
            0%, 34% { opacity: 0; }
            48%, 100% { opacity: 1; }
        }

        #root.launch-shake {
            animation: launch-screen-shake 700ms ease-in-out;
        }

        #root.launch-final {
            animation: launch-screen-final 900ms cubic-bezier(0.5, 0, 0.75, 0.2) forwards;
        }

        #root.launch-final::after {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at 50% 70%, #fff2cc 0, rgba(255, 118, 74, 0.9) 12%, #070b16 72%);
            content: "";
            opacity: 0;
            pointer-events: none;
            animation: launch-flash 900ms ease-in forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            #root.launch-shake,
            #root.launch-final,
            #root.launch-final::after {
                animation: none;
            }
        }
    </style>
</head>
<body style="margin: 0; background: #070b16;">
    <div id="root"></div>

    <!-- Dados injetados pelo Flask via Jinja2 -->
    <script id="mission-bootstrap" type="application/json">
        {{ {
            "nasaConstants": nasa_constants,
            "marsSites": mars_sites,
            "modules": modules,
            "rocketArchitectures": rocket_architectures,
            "defaultModules": default_modules,
            "initialLoadout": initial_loadout
        } | tojson }}
    </script>

    <!-- React e ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Código compartilhado (estilos, header e footer) + sidebar de telemetria + página de planejamento -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mission-sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/planning.js') }}"></script>
</body>
</html>
