<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="Plan a mission to Mars in the NASA Space Apps Challenge.">
    <title>Mars Mission | NASA Space Apps Challenge</title>
</head>
<body style="margin: 0; background: #070b16;">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
        const h = React.createElement;

        const colors = {
            background: "#070b16",
            panel: "rgba(17, 26, 45, 0.78)",
            text: "#f4f7ff",
            muted: "#a7b3c9",
            orange: "#ff764a",
            cyan: "#70e1e8",
            border: "rgba(173, 194, 225, 0.17)"
        };

        const page = {
            minHeight: "100vh",
            overflow: "hidden",
            color: colors.text,
            fontFamily: "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
            background:
                "radial-gradient(ellipse at 82% 35%, rgba(32, 71, 116, 0.28), transparent 38%), " +
                "radial-gradient(ellipse at 12% 4%, rgba(255, 118, 74, 0.11), transparent 32%), " +
                colors.background
        };

        const container = {
            width: "min(1120px, calc(100% - 48px))",
            margin: "0 auto"
        };

        const landingSites = [
            { id: "jezero", name: "Jezero Crater", temperature: -55, latitude: "18.38° N", left: "68%", top: "48%" },
            { id: "arcadia", name: "Arcadia Planitia", temperature: -68, latitude: "40° N", left: "27%", top: "30%" },
            { id: "gale", name: "Gale Crater", temperature: -45, latitude: "5.4° S", left: "82%", top: "72%" },
            { id: "valles", name: "Valles Marineris", temperature: -50, latitude: "14° S", left: "42%", top: "74%" }
        ];

        const difficultyOptions = [
            { id: "easy", name: "Easy", detail: "More forgiving conditions" },
            { id: "standard", name: "Standard", detail: "Balanced mission challenge" },
            { id: "hard", name: "Hard", detail: "Tighter survival margins" }
        ];

        function App() {
            const [screen, setScreen] = React.useState("landing");
            const [crewSize, setCrewSize] = React.useState(4);
            const [difficulty, setDifficulty] = React.useState("standard");
            const [siteId, setSiteId] = React.useState("jezero");
            const selectedSite = landingSites.find(function (site) { return site.id === siteId; });
            const selectedDifficulty = difficultyOptions.find(function (option) { return option.id === difficulty; });

            const highlights = [
                { number: "01", label: "CHOOSE A LANDING SITE", detail: "Jezero, Arcadia, and more" },
                { number: "02", label: "BUILD YOUR MISSION", detail: "Resources, power, and crew" },
                { number: "03", label: "SURVIVE ON MARS", detail: "Every choice shapes the outcome" }
            ];

            function plannerContent() {
                const gameUrl = "/game?crew_size=" + crewSize +
                    "&difficulty=" + encodeURIComponent(difficulty) +
                    "&site=" + encodeURIComponent(siteId);

                return h("section", {
                    style: Object.assign({}, container, { paddingTop: "44px", paddingBottom: "60px" })
                },
                    h("button", {
                        type: "button",
                        onClick: function () { setScreen("landing"); },
                        style: {
                            padding: "8px 0",
                            border: "none",
                            background: "transparent",
                            color: colors.cyan,
                            cursor: "pointer",
                            fontSize: "11px",
                            fontWeight: 800,
                            letterSpacing: "1.2px"
                        }
                    }, "← BACK TO OVERVIEW"),
                    h("div", { style: { margin: "22px 0 28px" } },
                        h("div", {
                            style: {
                                color: colors.orange,
                                fontSize: "10px",
                                fontWeight: 800,
                                letterSpacing: "2px"
                            }
                        }, "MISSION PLANNER // STEP 01"),
                        h("h1", {
                            style: {
                                margin: "10px 0 8px",
                                fontSize: "clamp(34px, 5vw, 52px)",
                                letterSpacing: "-2px"
                            }
                        }, "Build your mission plan"),
                        h("p", {
                            style: { margin: 0, color: colors.muted, fontSize: "14px", lineHeight: 1.7 }
                        }, "Choose your crew, set the challenge, and select a landing site using its estimated average surface temperature.")
                    ),
                    h("div", {
                        style: {
                            display: "flex",
                            alignItems: "stretch",
                            flexWrap: "wrap",
                            gap: "20px"
                        }
                    },
                        h("section", {
                            style: {
                                flex: "1 1 540px",
                                minWidth: "0",
                                padding: "20px",
                                border: "1px solid " + colors.border,
                                borderRadius: "8px",
                                background: colors.panel,
                                boxSizing: "border-box"
                            },
                            "aria-label": "Mars thermal map"
                        },
                            h("div", {
                                style: {
                                    display: "flex",
                                    justifyContent: "space-between",
                                    alignItems: "center",
                                    flexWrap: "wrap",
                                    gap: "10px",
                                    marginBottom: "16px"
                                }
                            },
                                h("div", { style: { fontSize: "11px", fontWeight: 800, letterSpacing: "1.3px" } }, "MARS THERMAL MAP"),
                                h("span", { style: { color: colors.muted, fontSize: "10px" } }, "SCHEMATIC · PROJECT ESTIMATES")
                            ),
                            h("div", {
                                style: {
                                    position: "relative",
                                    minHeight: "350px",
                                    overflow: "hidden",
                                    border: "1px solid rgba(255,255,255,.1)",
                                    borderRadius: "6px",
                                    background:
                                        "radial-gradient(ellipse at 73% 72%, rgba(255, 104, 57, .86), transparent 18%), " +
                                        "radial-gradient(ellipse at 42% 74%, rgba(255, 139, 66, .72), transparent 20%), " +
                                        "radial-gradient(ellipse at 68% 48%, rgba(255, 125, 68, .64), transparent 21%), " +
                                        "radial-gradient(ellipse at 27% 30%, rgba(81, 163, 232, .85), transparent 22%), " +
                                        "radial-gradient(ellipse at 45% 45%, rgba(187, 80, 57, .9), transparent 56%), " +
                                        "linear-gradient(140deg, #552c38, #ad533a 48%, #482b3d)",
                                    backgroundSize: "cover",
                                    boxShadow: "inset 0 0 70px rgba(6, 9, 20, .55)"
                                }
                            },
                                h("div", {
                                    style: {
                                        position: "absolute",
                                        inset: 0,
                                        opacity: .14,
                                        backgroundImage: "linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px)",
                                        backgroundSize: "40px 40px",
                                        pointerEvents: "none"
                                    }
                                }),
                                landingSites.map(function (site) {
                                    const isSelected = site.id === siteId;
                                    return h("button", {
                                        key: site.id,
                                        type: "button",
                                        onClick: function () { setSiteId(site.id); },
                                        "aria-pressed": isSelected,
                                        "aria-label": site.name + ", average temperature " + site.temperature + " degrees Celsius",
                                        title: site.name + " · " + site.temperature + "°C",
                                        style: {
                                            position: "absolute",
                                            left: site.left,
                                            top: site.top,
                                            transform: "translate(-50%, -50%)",
                                            display: "flex",
                                            alignItems: "center",
                                            gap: "7px",
                                            padding: "7px 9px",
                                            border: "1px solid " + (isSelected ? colors.cyan : "rgba(255,255,255,.42)"),
                                            borderRadius: "20px",
                                            background: isSelected ? "#0b1724" : "rgba(8, 13, 24, .78)",
                                            color: colors.text,
                                            cursor: "pointer",
                                            whiteSpace: "nowrap",
                                            boxShadow: isSelected ? "0 0 0 3px rgba(112,225,232,.2)" : "none",
                                            fontSize: "10px",
                                            fontWeight: 700
                                        }
                                    },
                                        h("span", {
                                            style: {
                                                width: "8px",
                                                height: "8px",
                                                borderRadius: "50%",
                                                background: site.temperature <= -60 ? "#70d6ff" : site.temperature <= -50 ? "#ffb05e" : "#ff654a",
                                                boxShadow: "0 0 10px currentColor"
                                            }
                                        }),
                                        site.name
                                    );
                                }),
                                h("div", {
                                    style: {
                                        position: "absolute",
                                        left: "12px",
                                        bottom: "12px",
                                        color: "rgba(255,255,255,.72)",
                                        fontSize: "9px",
                                        letterSpacing: "1.1px",
                                        pointerEvents: "none"
                                    }
                                }, "N  ↑")
                            ),
                            h("div", {
                                style: {
                                    display: "flex",
                                    alignItems: "center",
                                    gap: "10px",
                                    marginTop: "15px",
                                    color: colors.muted,
                                    fontSize: "10px"
                                }
                            },
                                h("span", null, "COLDER"),
                                h("span", {
                                    style: {
                                        flex: 1,
                                        height: "7px",
                                        borderRadius: "8px",
                                        background: "linear-gradient(90deg, #54b9ed, #e1b45d, #ff654a)"
                                    }
                                }),
                                h("span", null, "WARMER")
                            ),
                            h("div", {
                                style: {
                                    marginTop: "18px",
                                    padding: "15px",
                                    border: "1px solid " + colors.border,
                                    borderRadius: "5px",
                                    background: "rgba(7, 11, 22, .58)",
                                    display: "flex",
                                    justifyContent: "space-between",
                                    alignItems: "center",
                                    flexWrap: "wrap",
                                    gap: "12px"
                                }
                            },
                                h("div", null,
                                    h("div", { style: { color: colors.cyan, fontSize: "9px", letterSpacing: "1.3px", fontWeight: 800 } }, "SELECTED LANDING SITE"),
                                    h("div", { style: { marginTop: "5px", fontSize: "15px", fontWeight: 700 } }, selectedSite.name),
                                    h("div", { style: { marginTop: "4px", color: colors.muted, fontSize: "11px" } }, "Latitude " + selectedSite.latitude)
                                ),
                                h("div", { style: { textAlign: "right" } },
                                    h("div", { style: { color: colors.muted, fontSize: "9px", letterSpacing: "1px" } }, "AVG. SURFACE TEMP."),
                                    h("div", { style: { marginTop: "3px", color: colors.orange, fontSize: "24px", fontWeight: 800 } }, selectedSite.temperature + "°C")
                                )
                            ),
                            h("p", {
                                style: { margin: "12px 0 0", color: colors.muted, fontSize: "10px", lineHeight: 1.6 }
                            }, "Temperature values are average estimates from the current project dataset; the map is a schematic, not a live NASA thermal layer.")
                        ),
                        h("aside", {
                            style: {
                                flex: "1 1 300px",
                                minWidth: "0",
                                display: "flex",
                                flexDirection: "column",
                                gap: "16px"
                            }
                        },
                            h("section", {
                                style: {
                                    padding: "20px",
                                    border: "1px solid " + colors.border,
                                    borderRadius: "8px",
                                    background: colors.panel
                                }
                            },
                                h("div", { style: { fontSize: "11px", fontWeight: 800, letterSpacing: "1.3px" } }, "CREW SIZE"),
                                h("div", {
                                    style: {
                                        display: "flex",
                                        alignItems: "baseline",
                                        justifyContent: "space-between",
                                        marginTop: "12px"
                                    }
                                },
                                    h("label", { htmlFor: "crew-size", style: { color: colors.muted, fontSize: "12px" } }, "Crew members"),
                                    h("output", {
                                        htmlFor: "crew-size",
                                        style: { color: colors.cyan, fontSize: "26px", fontWeight: 800 }
                                    }, String(crewSize))
                                ),
                                h("input", {
                                    id: "crew-size",
                                    type: "range",
                                    min: 1,
                                    max: 12,
                                    step: 1,
                                    value: crewSize,
                                    onChange: function (event) { setCrewSize(Number(event.target.value)); },
                                    "aria-label": "Number of crew members",
                                    style: { width: "100%", margin: "12px 0", accentColor: colors.orange, cursor: "pointer" }
                                }),
                                h("div", {
                                    style: { display: "flex", justifyContent: "space-between", color: colors.muted, fontSize: "10px" }
                                }, h("span", null, "1 PERSON"), h("span", null, "12 PEOPLE"))
                            ),
                            h("section", {
                                style: {
                                    padding: "20px",
                                    border: "1px solid " + colors.border,
                                    borderRadius: "8px",
                                    background: colors.panel
                                }
                            },
                                h("div", { style: { marginBottom: "12px", fontSize: "11px", fontWeight: 800, letterSpacing: "1.3px" } }, "MISSION DIFFICULTY"),
                                difficultyOptions.map(function (option) {
                                    const isSelected = option.id === difficulty;
                                    return h("button", {
                                        key: option.id,
                                        type: "button",
                                        onClick: function () { setDifficulty(option.id); },
                                        "aria-pressed": isSelected,
                                        style: {
                                            width: "100%",
                                            marginTop: "8px",
                                            padding: "11px 12px",
                                            display: "flex",
                                            justifyContent: "space-between",
                                            alignItems: "center",
                                            gap: "10px",
                                            textAlign: "left",
                                            border: "1px solid " + (isSelected ? colors.cyan : colors.border),
                                            borderRadius: "5px",
                                            background: isSelected ? "rgba(112, 225, 232, .08)" : "rgba(7, 11, 22, .38)",
                                            color: colors.text,
                                            cursor: "pointer"
                                        }
                                    },
                                        h("span", null,
                                            h("span", { style: { display: "block", fontSize: "12px", fontWeight: 800 } }, option.name),
                                            h("span", { style: { display: "block", marginTop: "4px", color: colors.muted, fontSize: "10px" } }, option.detail)
                                        ),
                                        h("span", { style: { color: isSelected ? colors.cyan : colors.muted, fontSize: "15px" } }, isSelected ? "●" : "○")
                                    );
                                })
                            ),
                            h("div", {
                                "aria-live": "polite",
                                style: {
                                    padding: "16px",
                                    borderLeft: "2px solid " + colors.orange,
                                    background: "rgba(255, 118, 74, .07)",
                                    color: colors.muted,
                                    fontSize: "11px",
                                    lineHeight: 1.7
                                }
                            },
                                h("strong", { style: { color: colors.text } }, "MISSION PREVIEW"),
                                h("br"),
                                crewSize + (crewSize === 1 ? " crew member" : " crew members") + " · " + selectedDifficulty.name + " difficulty",
                                h("br"),
                                selectedSite.name + " · " + selectedSite.temperature + "°C average"
                                ),
                                h("a", {
                                    href: gameUrl,
                                    "aria-label": "Start the Mars colony game",
                                    style: {
                                        display: "flex",
                                        alignItems: "center",
                                        justifyContent: "center",
                                        gap: "12px",
                                        minHeight: "50px",
                                        padding: "0 18px",
                                        borderRadius: "4px",
                                        background: colors.orange,
                                        color: "#160c0a",
                                        fontSize: "11px",
                                        fontWeight: 900,
                                        letterSpacing: "1.1px",
                                        textDecoration: "none",
                                        boxShadow: "0 10px 28px rgba(255, 118, 74, .18)"
                                    }
                                }, "START GAME", h("span", { "aria-hidden": "true", style: { fontSize: "17px" } }, "→"))
                            )
                    )
                );
            }

            return h("main", { style: page },
                h("header", {
                    style: Object.assign({}, container, {
                        minHeight: "88px",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "space-between",
                        gap: "24px",
                        borderBottom: "1px solid " + colors.border
                    })
                },
                    h("a", {
                        href: "/",
                        "aria-label": "NASA Space Apps Challenge - home",
                        style: {
                            display: "flex",
                            alignItems: "center",
                            gap: "12px",
                            color: colors.text,
                            textDecoration: "none"
                        }
                    },
                        h("span", {
                            style: {
                                width: "38px",
                                height: "38px",
                                display: "grid",
                                placeItems: "center",
                                border: "1px solid rgba(112, 225, 232, .6)",
                                borderRadius: "50%",
                                color: colors.cyan,
                                fontSize: "19px"
                            }
                        }, "✦"),
                        h("span", { style: { fontSize: "12px", lineHeight: 1.35, letterSpacing: "1.5px", fontWeight: 800 } },
                            "NASA SPACE APPS",
                            h("br"),
                            h("span", { style: { color: colors.muted, fontSize: "10px", fontWeight: 500 } }, "MARS CHALLENGE")
                        )
                    ),
                    h("div", {
                        style: {
                            color: colors.cyan,
                            fontSize: "11px",
                            fontWeight: 700,
                            letterSpacing: "1.8px",
                            textAlign: "right"
                        }
                    }, "MISSION CONTROL", h("br"), h("span", {
                        style: { color: colors.muted, fontWeight: 500, letterSpacing: "1px" }
                    }, "MISSION MARS // 2045"))
                ),

                screen === "landing" ? h(React.Fragment, null,
                h("section", {
                    style: Object.assign({}, container, {
                        minHeight: "590px",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "space-between",
                        gap: "32px",
                        paddingTop: "54px",
                        paddingBottom: "54px",
                        boxSizing: "border-box",
                        flexWrap: "wrap"
                    })
                },
                    h("div", { style: { flex: "1 1 440px", maxWidth: "570px", zIndex: 1 } },
                        h("div", {
                            style: {
                                display: "inline-flex",
                                alignItems: "center",
                                gap: "9px",
                                padding: "8px 12px",
                                border: "1px solid rgba(112, 225, 232, .28)",
                                borderRadius: "4px",
                                background: "rgba(112, 225, 232, .06)",
                                color: colors.cyan,
                                fontSize: "10px",
                                letterSpacing: "1.7px",
                                fontWeight: 800
                            }
                        }, h("span", { style: { color: colors.orange } }, "●"), " MISSION SIMULATION // MARS"),
                        h("h1", {
                            style: {
                                margin: "25px 0 18px",
                                fontSize: "clamp(42px, 7vw, 76px)",
                                lineHeight: 0.99,
                                letterSpacing: "-3.5px",
                                fontWeight: 850
                            }
                        }, "Humanity's", h("br"), h("span", { style: { color: colors.orange } }, "future"), h("br"), "is red."),
                        h("p", {
                            style: {
                                maxWidth: "490px",
                                margin: "0 0 30px",
                                color: colors.muted,
                                fontSize: "16px",
                                lineHeight: 1.8
                            }
                        }, "A mission to Mars depends on making the right choices. Plan your colony, manage resources, and find out if your crew can survive on the Red Planet."),
                        h("div", {
                            style: {
                                display: "flex",
                                alignItems: "center",
                                flexWrap: "wrap",
                                gap: "16px"
                            }
                        },
                            h("a", {
                                href: "#planner",
                                onClick: function (event) {
                                    event.preventDefault();
                                    setScreen("planner");
                                    window.scrollTo({ top: 0, behavior: "smooth" });
                                },
                                "aria-label": "Start planning your Mars mission",
                                style: {
                                    display: "inline-flex",
                                    alignItems: "center",
                                    justifyContent: "center",
                                    gap: "13px",
                                    minHeight: "54px",
                                    padding: "0 23px",
                                    borderRadius: "4px",
                                    background: colors.orange,
                                    color: "#160c0a",
                                    fontSize: "12px",
                                    fontWeight: 900,
                                    letterSpacing: "1.2px",
                                    textDecoration: "none",
                                    boxShadow: "0 10px 35px rgba(255, 118, 74, .2)"
                                }
                            }, "START MISSION", h("span", { "aria-hidden": "true", style: { fontSize: "18px" } }, "→")),
                            h("span", { style: { color: colors.muted, fontSize: "11px", letterSpacing: ".5px" } }, "GET READY FOR LIFTOFF")
                        )
                    ),
                    h("div", {
                        style: {
                            flex: "1 1 340px",
                            minWidth: "0",
                            display: "flex",
                            justifyContent: "center",
                            position: "relative"
                        }
                    },
                        h("div", {
                            style: {
                                position: "absolute",
                                width: "min(420px, 90vw)",
                                aspectRatio: "1",
                                border: "1px solid rgba(112, 225, 232, .14)",
                                borderRadius: "50%",
                                boxShadow: "0 0 0 35px rgba(112, 225, 232, .025), 0 0 0 75px rgba(112, 225, 232, .02)"
                            }
                        }),
                        h("img", {
                            src: "{{ url_for('static', filename='pixellab-astronaut-next-to-spacecraft-1794664482724.png') }}",
                            alt: "Astronaut standing beside a spacecraft on the surface of Mars",
                            style: {
                                position: "relative",
                                display: "block",
                                width: "min(100%, 430px)",
                                height: "auto",
                                objectFit: "contain",
                                filter: "drop-shadow(0 22px 50px rgba(0, 0, 0, .45))"
                            }
                        }),
                        h("div", {
                            style: {
                                position: "absolute",
                                right: "0",
                                bottom: "8%",
                                padding: "13px 17px",
                                border: "1px solid " + colors.border,
                                borderRadius: "4px",
                                background: colors.panel,
                                backdropFilter: "blur(10px)"
                            }
                        },
                            h("div", { style: { color: colors.cyan, fontSize: "9px", letterSpacing: "1.6px", fontWeight: 800 } }, "DESTINATION"),
                            h("div", { style: { marginTop: "5px", fontSize: "14px", fontWeight: 700 } }, "MARS · 225 MILLION KM")
                        )
                    )
                ),

                h("section", { style: Object.assign({}, container, { paddingBottom: "58px" }), "aria-label": "Mission stages" },
                    h("div", {
                        style: {
                            display: "flex",
                            flexWrap: "wrap",
                            border: "1px solid " + colors.border,
                            borderRadius: "6px",
                            background: "rgba(15, 23, 40, .72)"
                        }
                    }, highlights.map(function (item, index) {
                        return h("div", {
                            key: item.number,
                            style: {
                                flex: "1 1 210px",
                                display: "flex",
                                gap: "15px",
                                alignItems: "flex-start",
                                padding: "22px",
                                boxSizing: "border-box",
                                borderRight: index < highlights.length - 1 ? "1px solid " + colors.border : "none"
                            }
                        },
                            h("span", { style: { color: colors.orange, fontSize: "12px", fontWeight: 800 } }, item.number),
                            h("div", null,
                                h("div", { style: { fontSize: "10px", letterSpacing: "1.3px", fontWeight: 800 } }, item.label),
                                h("div", { style: { marginTop: "7px", color: colors.muted, fontSize: "12px" } }, item.detail)
                            )
                        );
                    }))
                )) : plannerContent(),

                h("footer", {
                    style: Object.assign({}, container, {
                        padding: "18px 0 25px",
                        borderTop: "1px solid " + colors.border,
                        color: colors.muted,
                        fontSize: "10px",
                        letterSpacing: ".7px",
                        display: "flex",
                        justifyContent: "space-between",
                        flexWrap: "wrap",
                        gap: "10px"
                    })
                },
                    h("span", null, "NASA SPACE APPS CHALLENGE · MARS MISSION"),
                    h("span", null, "ONE SMALL STEP TOWARD YOUR NEXT GREAT MISSION")
                )
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
</body>
</html>
