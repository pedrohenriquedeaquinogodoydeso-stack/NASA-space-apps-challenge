<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="Plan a mission to Mars in the NASA Space Apps Challenge.">
    <title>Mars Mission | NASA Space Apps Challenge</title>
</head>
<body style="margin: 0; background: #070b16;">
    <div id="root"></div>

    <!-- Dados injetados pelo Flask via Jinja2 -->
    <script id="mission-bootstrap" type="application/json">
        {{ {
            "nasaConstants": nasa_constants,
            "marsSites": mars_sites,
            "modules": modules,
            "rocketArchitectures": rocket_architectures,
            "defaultModules": default_modules,
            "initialLoadout": initial_loadout
        } | tojson }}
    </script>

    <!-- React e ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Seu código JavaScript externo -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
