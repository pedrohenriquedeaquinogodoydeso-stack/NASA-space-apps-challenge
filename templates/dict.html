<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de sobrevivência</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1eef8; --panel:#ffffff; --line:#cfc8e6; --text:#201a38; --muted:#625b80;
  --solar:#b86e00; --water:#0b7f8c; --alert:#c42f43; --glow:rgba(184,110,0,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13102a; --panel:#1d1940; --line:#3a3380; --text:#f2eefc; --muted:#a69fcb;
    --solar:#ffb02e; --water:#3fe0d0; --alert:#ff5a6b; --glow:rgba(255,176,46,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13102a; --panel:#1d1940; --line:#3a3380; --text:#f2eefc; --muted:#a69fcb;
  --solar:#ffb02e; --water:#3fe0d0; --alert:#ff5a6b; --glow:rgba(255,176,46,.16);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.app{max-width:900px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--line)}
h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.hud{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.clock{font-variant-numeric:tabular-nums;color:var(--water);font-weight:600;font-size:1.1rem}
.main{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:18px}
nav{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);
  border-radius:4px;padding:12px 14px;text-align:left;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  transition:border-color .15s,background .15s}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--c,var(--solar));background:var(--glow)}
button .k{display:inline-block;min-width:1.6em;margin-right:8px;padding:0 6px;border-radius:3px;
  background:var(--line);color:var(--text);font-weight:700;text-align:center}
button[aria-pressed="true"] .k{background:var(--c,var(--solar));color:#13102a}
.screen{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:20px;min-height:240px;
  border-left:6px solid var(--c,var(--solar))}
.screen h2{margin:0 0 10px;font-size:1.25rem;color:var(--c,var(--solar))}
.screen p{margin:0;font-size:1.08rem;max-width:62ch}
.entry+.entry{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.foot{margin-top:12px;color:var(--muted);font-size:.85rem}
@media (max-width:640px){
  .main{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap}
  nav button{flex:1 1 calc(50% - 10px)}
}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Painel de sobrevivência</h1>
    <div class="hud"><span>Tempo de jogo</span><span class="clock" id="clock">00:00</span></div>
  </header>

  <div class="main">
    <nav id="nav" aria-label="Categorias de informação"></nav>
    <section class="screen" id="screen" aria-live="polite"></section>
  </div>
  <p class="foot">Atalhos do teclado: 1, 2 e 3 abrem cada informação. A tecla 0 mostra todas.</p>
</div>

<script>
